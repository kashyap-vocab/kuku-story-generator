<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Serial writer{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_v }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="top">
    <a href="/" class="brand">Serial writer</a>
    {% block crumbs %}{% endblock %}
  </header>
  <div class="layout {{ 'with-dash' if story is defined and story }}">
    <main class="{% block main_class %}{% endblock %}">
      {% if request.query_params.get('error') %}
        <div class="flash error">{{ request.query_params.get('error') }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    {% if story is defined and story %}
    <aside class="dash card" hx-get="/stories/{{ story.id }}/dashboard" hx-trigger="load, every 5s" hx-swap="innerHTML"></aside>
    {% endif %}
  </div>
  {% block actionbar %}{% endblock %}
</body>
</html>
